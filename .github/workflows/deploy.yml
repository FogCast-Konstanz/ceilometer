# Publish only. The Pi's systemd timer pulls releases over an outbound connection.
# This workflow requires no Pi address, SSH secret, webhook or inbound access.
name: Test, build and publish for Pi polling
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'software/instrument/**'
      - 'deploy/**'
      - 'interfaces/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ceilometer-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libusb-1.0-0-dev
          # Use the same Arm release as the validated local firmware build.
          archive=arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
          curl --fail --location --retry 3 "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/$archive" --output "$RUNNER_TEMP/$archive"
          echo "597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "PICO_TOOLCHAIN_PATH=$RUNNER_TEMP/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r software/instrument/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Host tests
        run: |
          cmake -S firmware/pico2 -B build/host -G Ninja -DCEIL_HOST_TESTS=ON
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure
      - name: Pico SDK and firmware
        run: |
          git clone --depth 1 --branch 2.3.0 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init lib/tinyusb
          cmake -S firmware/pico2 -B build/firmware -G Ninja -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" -DPICO_BOARD=pico2 -DCEIL_ENABLE_LASER=ON -DCEIL_ENABLE_BIAS=ON -DCEIL_ENABLE_TEC=ON -DCEIL_BIAS_MAX_CODE=60210
          cmake --build build/firmware --parallel 2
      - name: Package and publish deployment branch
        run: |
          python deploy/releases/package_release.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/ceilometer.tar.gz"
          bash deploy/releases/publish_branch.sh "$RUNNER_TEMP/ceilometer.tar.gz"
